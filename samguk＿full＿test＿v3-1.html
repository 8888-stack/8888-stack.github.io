<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>삼국지 인물 성격 테스트 - 하이엔드 버전</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #020617;
      --bg-soft: #020617;
      --card: #020617;
      --accent: #facc15;
      --accent-strong: #f97316;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border-soft: rgba(148, 163, 184, 0.5);
      --danger: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background:
        radial-gradient(circle at 0% 0%, #1d283a 0, transparent 55%),
        radial-gradient(circle at 100% 0%, #4b1d37 0, transparent 55%),
        radial-gradient(circle at 50% 120%, #1e3a8a 0, transparent 60%),
        var(--bg-soft);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 12px 40px;
      -webkit-font-smoothing: antialiased;
    }

    .halo {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .halo-dot {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 999px;
      filter: blur(40px);
      opacity: 0.18;
      animation: float 16s infinite alternate ease-in-out;
    }

    .halo-dot.a {
      background: #f97316;
      top: -60px;
      left: -40px;
    }

    .halo-dot.b {
      background: #22c55e;
      top: 40%;
      right: -80px;
      animation-delay: -6s;
    }

    .halo-dot.c {
      background: #3b82f6;
      bottom: -120px;
      left: 20%;
      animation-delay: -3s;
    }

    @keyframes float {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(10px, -14px, 0) scale(1.08);
      }
    }

    .app {
      width: 100%;
      max-width: 960px;
      animation: fadeIn 0.9s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate3d(0, 10px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    .card {
      background:
        linear-gradient(145deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.98)),
        radial-gradient(circle at top left, rgba(250, 204, 21, 0.12), transparent 60%);
      border-radius: 22px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.7);
      padding: 26px 18px 26px;
      backdrop-filter: blur(18px);
    }

    @media (min-width: 768px) {
      .card {
        padding: 30px 32px 30px;
      }
    }

    header {
      margin-bottom: 18px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .title-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-main .icon {
      font-size: 2rem;
      filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8));
      animation: wobble 3.5s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      20% { transform: rotate(-4deg) translateY(-1px); }
      40% { transform: rotate(3deg) translateY(0); }
      60% { transform: rotate(-2deg) translateY(1px); }
      80% { transform: rotate(1deg) translateY(0); }
    }

    .title-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title-text h1 {
      font-size: 1.7rem;
      margin: 0;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .title-text h1 span.highlight {
      background: linear-gradient(120deg, #facc15, #f97316);
      -webkit-background-clip: text;
      color: transparent;
    }

    .title-sub {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .meta {
      text-align: right;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.9), #020617);
    }

    .meta-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.9);
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .badge {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      color: var(--muted);
      background: rgba(15, 23, 42, 0.85);
    }

    .badge.accent {
      border-color: rgba(250, 204, 21, 0.9);
      color: var(--accent);
      background: radial-gradient(circle at top left, rgba(250, 204, 21, 0.18), rgba(15, 23, 42, 0.96));
    }

    .divider {
      border: none;
      border-top: 1px dashed rgba(148, 163, 184, 0.7);
      margin: 18px 0 20px;
    }

    .question {
      margin-bottom: 16px;
      padding: 13px 13px 10px;
      border-radius: 14px;
      background:
        radial-gradient(circle at top left, rgba(248, 250, 252, 0.04), transparent 60%),
        rgba(15, 23, 42, 0.9);
      border: 1px solid transparent;
      transition: border-color 0.18s ease, background 0.18s ease,
        transform 0.12s ease, box-shadow 0.18s ease;
      position: relative;
      overflow: hidden;
    }

    .question::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: conic-gradient(from 220deg, transparent 0deg, rgba(250, 204, 21, 0.18) 40deg, transparent 70deg);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .question:hover {
      border-color: rgba(250, 204, 21, 0.7);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.9);
    }

    .question:hover::before {
      opacity: 1;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }

    .q-index {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .q-title {
      font-weight: 600;
      font-size: 0.98rem;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      margin-top: 4px;
    }

    @media (min-width: 640px) {
      .options {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--muted);
      transition: background 0.15s ease, color 0.15s ease, transform 0.08s ease,
        border-color 0.15s ease, box-shadow 0.18s ease;
      border: 1px solid transparent;
      background: rgba(15, 23, 42, 0.8);
    }

    .option:hover {
      background: rgba(15, 23, 42, 0.98);
      border-color: rgba(148, 163, 184, 0.8);
      color: var(--text);
      transform: translateY(-0.5px);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.9);
    }

    .option input {
      appearance: none;
      width: 18px;
      height: 18px;
      min-width: 18px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.8);
      outline: none;
      position: relative;
      cursor: pointer;
      background: radial-gradient(circle, #020617, #020617);
      display: inline-block;
    }

    .option input:checked {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.9), 0 0 14px rgba(250, 204, 21, 0.45);
    }

    .option input:checked::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: inherit;
      background: radial-gradient(circle at 30% 30%, var(--accent), var(--accent-strong));
    }

    .option-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .opt-key {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.9);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .option input:checked + .option-label .opt-key {
      border-color: rgba(250, 204, 21, 0.95);
      color: var(--accent);
      background: radial-gradient(circle at top left, rgba(250, 204, 21, 0.2), rgba(15, 23, 42, 0.96));
    }

    .opt-text {
      line-height: 1.3;
    }

    .footer {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
    }

    .progress {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .progress-bar {
      width: 160px;
      max-width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(30, 64, 175, 0.7);
      overflow: hidden;
    }

    .progress-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #facc15, #f97316);
      box-shadow: 0 0 10px rgba(248, 250, 252, 0.9);
      transition: width 0.18s ease-out;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      border: none;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.1s ease,
        background 0.18s ease, border-color 0.18s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: radial-gradient(circle at top left, #facc15, #f97316);
      color: #111827;
      box-shadow: 0 12px 28px rgba(250, 204, 21, 0.4);
      border: 1px solid rgba(250, 250, 250, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 34px rgba(250, 204, 21, 0.55);
      filter: brightness(1.04);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 8px 20px rgba(250, 204, 21, 0.35);
    }

    .btn-ghost {
      background: rgba(15, 23, 42, 0.95);
      color: var(--muted);
      border: 1px solid rgba(148, 163, 184, 0.7);
    }

    .btn-ghost:hover {
      border-color: rgba(248, 250, 252, 0.9);
      color: var(--text);
      background: rgba(15, 23, 42, 1);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.9);
    }

    .btn-ghost:active {
      transform: translateY(0);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.8);
    }

    .err {
      color: var(--danger);
      font-size: 0.82rem;
      margin-top: 6px;
      display: none;
    }

    .result-card {
      margin-top: 22px;
      padding: 18px 16px 16px;
      border-radius: 18px;
      background:
        radial-gradient(circle at top right, rgba(250, 204, 21, 0.14), transparent 60%),
        radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.12), transparent 60%),
        #020617;
      border: 1px solid rgba(250, 204, 21, 0.8);
      display: none;
      animation: resultIn 0.6s ease-out;
    }

    @keyframes resultIn {
      from {
        opacity: 0;
        transform: translate3d(0, 8px, 0) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .result-tag {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
    }

    .result-title {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .result-subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .result-body {
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .result-chip-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: rgba(148, 163, 184, 0.9);
      margin-top: 4px;
      margin-bottom: 4px;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 2px;
    }

    .chip {
      font-size: 0.8rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.9);
      color: var(--text);
    }

    .counts {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .counts span {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    .share-row {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .share-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
    }

    @media (max-width: 480px) {
      .title-text h1 {
        font-size: 1.4rem;
      }
      .card {
        padding: 22px 16px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="halo">
    <div class="halo-dot a"></div>
    <div class="halo-dot b"></div>
    <div class="halo-dot c"></div>
  </div>

  <main class="app">
    <section class="card">
      <header>
        <div class="title-row">
          <div class="title-main">
            <span class="icon">🐲</span>
            <div class="title-text">
              <h1><span class="highlight">삼국지 인물</span> 성격 테스트</h1>
              <div class="title-sub">
                20문항으로 살펴보는 나의 전장 성향. 당신은 책사 타입인가, 장수 타입인가?
              </div>
            </div>
          </div>
          <div class="meta">
            <div class="meta-pill">
              <span class="meta-dot"></span>
              <span>삼국지 30+ 인물 매칭</span>
            </div>
          </div>
        </div>
        <div class="badge-row">
          <span class="badge accent">20 Questions</span>
          <span class="badge">A~E 유형</span>
          <span class="badge">대표 인물 매칭</span>
          <span class="badge">모바일 최적화</span>
        </div>
      </header>

      <hr class="divider" />

      <form id="quiz-form">
        <div id="questions-container"></div>

        <div class="footer">
          <div class="progress">
            <span id="progress-text">0 / 20 문항 응답됨</span>
            <div class="progress-bar">
              <div id="progress-bar-inner" class="progress-bar-inner"></div>
            </div>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="reset-btn">다시 풀기</button>
            <button type="submit" class="btn btn-primary">
              <span>결과 보기</span>
              <span>⚔️</span>
            </button>
          </div>
        </div>
        <div id="form-error" class="err">
          응답하지 않은 문항이 있습니다. 모든 문항을 체크해 주세요.
        </div>
      </form>

      <section id="result-card" class="result-card">
        <div class="result-header">
          <div>
            <div class="result-tag" id="result-type-label">
              TYPE
            </div>
            <div class="result-title" id="result-main-title">
              결과 제목
            </div>
          </div>
          <div>
            <span class="badge accent" id="result-letter-badge">A 유형</span>
          </div>
        </div>
        <div class="result-subtitle" id="result-subtitle">
          부제 영역
        </div>
        <div class="result-body" id="result-description">
          설명 텍스트
        </div>

        <div class="result-chip-label">대표 인물</div>
        <div class="chip-list" id="result-characters"></div>

        <div class="result-chip-label">키워드</div>
        <div class="chip-list" id="result-keywords"></div>

        <div class="counts" id="result-counts"></div>

        <div class="share-row">
          <button type="button" class="btn btn-ghost" id="copy-btn">결과 복사</button>
          <button type="button" class="btn btn-primary" id="share-btn">결과 공유</button>
        </div>
        <div class="share-hint">
          결과를 복사해서 카카오톡 / 디스코드 / 인스타 DM 등에 붙여넣어 공유해 보세요.
        </div>
      </section>
    </section>
  </main>

  <script>
    const questions = [
      {
        text: "중요한 일을 맡았을 때 나는…",
        options: {
          A: "내가 직접 나서 리드한다",
          B: "전략과 계획부터 세운다",
          C: "사람들을 설득하고 조율한다",
          D: "한 번 맡은 일은 끝까지 밀어붙인다",
          E: "상황 따라 유연하게 대처한다",
        },
      },
      {
        text: "팀 내 갈등이 발생하면…",
        options: {
          A: "강하게 개입해 정리한다",
          B: "원인을 분석하고 해결책을 제시한다",
          C: "모두의 의견을 듣고 중재한다",
          D: "감정적이더라도 내 편을 지킨다",
          E: "분위기를 풀며 자연스럽게 해결한다",
        },
      },
      {
        text: "새로운 프로젝트를 시작할 때 당신은?",
        options: {
          A: "방향·비전부터 제시",
          B: "자료 조사·전략 수립",
          C: "팀 구성과 역할 조정",
          D: "빠르게 행동으로 옮김",
          E: "즉흥적이지만 센스 있게 진행",
        },
      },
      {
        text: "목표를 달성하는 데 중요한 것은?",
        options: {
          A: "리더십",
          B: "지략",
          C: "신뢰",
          D: "의지",
          E: "적응력",
        },
      },
      {
        text: "시간이 부족할 때 당신은?",
        options: {
          A: "독단적으로 속도전",
          B: "우선순위 재조정",
          C: "주변 도움을 요청",
          D: "밤새서라도 끝냄",
          E: "계획을 유연하게 변경",
        },
      },
      {
        text: "누군가 약속을 어겼을 때 내 반응은?",
        options: {
          A: "단호하게 문제 제기",
          B: "원인을 파악함",
          C: "조용히 대화로 해결",
          D: "감정이 격해질 수도",
          E: "별 신경 안 씀",
        },
      },
      {
        text: "나는 보통 어떤 사람으로 보이나?",
        options: {
          A: "리더형",
          B: "지식·전략형",
          C: "따뜻하고 인품 좋은 사람",
          D: "용맹·의리파",
          E: "센스 있고 부드러운 타입",
        },
      },
      {
        text: "스트레스 받을 때 나는…",
        options: {
          A: "더 바쁘게 움직임",
          B: "계획을 다시 점검",

      {

      {

      {

        options: {

          B: "차분하게 계산",
          C: "조율 후 결정",

          E: "상황 따라 즉흥",
        },
      },
      {
        text: "가장 가치 있다고 생각하는 건?",
        options: {
          A: "권력·능력",
          B: "지혜·지식",
          C: "신뢰·의리",
          D: "용기·명예",
          E: "자유·평화",
        },
      },
      {
        text: "전쟁이 일어난다면 맡고 싶은 역할은?",
        options: {
          A: "총사령관",
          B: "군사(책략가)",
          C: "내정·민심 안정",
          D: "선봉 장수",
          E: "정보·보급·지원",
        },
      },
    ];

    const resultMap = {
      A: {
        letter: "A",
        name: "패왕·영걸형",
        mainTitle: "패왕·영걸형 — 큰 판을 짜는 리더",
        subtitle:
          "강한 추진력과 결단력으로 판을 이끄는 타입입니다. 리스크가 있어도 앞에서 길을 여는 쪽에 가깝습니다.",
        description:
          "조직의 방향을 제시하고 결정을 미루지 않습니다. 책임은 무겁지만, 그만큼 성취도 큽니다. 때때로 독단적으로 보일 수 있어 주변 의견을 한 번 더 듣는 습관을 들이면 리더십이 더 단단해집니다.",
        characters: ["조조", "손권", "원소", "동탁", "유선(초기)", "여포"],
        keywords: ["리더십", "결단력", "통솔력", "야망", "실행력"],
      },
      B: {
        letter: "B",
        name: "지략·분석형",
        mainTitle: "지략·분석형 — 판세를 읽는 전략가",
        subtitle:
          "직감보다 계산, 감정보다 효율에 가까운 스타일입니다. 한 수, 두 수 앞을 내다보는 것을 선호합니다.",
        description:
          "정보를 모으고 리스크를 줄이며 최적의 수를 찾는 것을 잘합니다. 단번에 폭발하기보다 ‘판 전체를 설계하는 사람’에 가깝죠. 냉철해 보일 수 있지만, 팀에선 반드시 필요한 브레인 포지션입니다.",
        characters: ["제갈량", "사마의", "곽가", "방통", "가후", "순유"],
        keywords: ["지략", "분석", "전략", "계획형", "냉철함"],
      },
      C: {
        letter: "C",
        name: "인덕·민심형",
        mainTitle: "인덕·민심형 — 사람을 모으는 지도자",
        subtitle:
          "사람을 중심에 두고 생각하는 타입입니다. 혼자 이기는 것보다 함께 가는 것을 더 중요하게 여깁니다.",
        description:
          "공감 능력이 뛰어나고 분위기와 관계를 세심하게 살핍니다. 누군가 힘들어할 때 그냥 지나치지 못하는 편이죠. 스스로 손해를 감수하는 경우도 생기니, 때로는 선을 긋는 연습도 도움이 됩니다.",
        characters: ["유비", "손견", "노숙", "장소", "감녕", "황충"],
        keywords: ["인덕", "공감", "관계", "신뢰", "협업"],
      },
      D: {
        letter: "D",
        name: "의리·용맹형",
        mainTitle: "의리·용맹형 — 앞에서 막아서는 방패",
        subtitle:
          "의리, 명예, 약속 같은 가치를 매우 중요하게 여깁니다. 말보다 행동이 먼저 나가는 타입입니다.",
        description:
          "믿음이 가는 사람, 의지할 수 있는 사람이라는 말을 자주 듣는 쪽입니다. 누군가 내 사람이라고 생각하면 기꺼이 희생도 감수하죠. 감정이 앞설 때 불필요하게 소모되지 않도록, 한 번 숨 고르기를 해보는 것이 좋습니다.",
        characters: ["관우", "장비", "조운", "허저", "태사자", "방덕", "황개"],
        keywords: ["의리", "용맹", "열정", "희생", "직진력"],
      },
      E: {
        letter: "E",
        name: "유연·적응형",
        mainTitle: "유연·적응형 — 흐름을 타는 플레이메이커",
        subtitle:
          "변화에 빠르게 적응하고 센스 있게 돌파구를 찾는 스타일입니다. 규칙보다 현실과 타이밍을 중시합니다.",
        description:
          "흐름을 읽고 센스 있게 움직이는 능력이 좋습니다. 분위기도 잘 띄우고, 갑작스러운 변수에도 유연하게 대처하죠. 다만 장기 플랜을 소홀히 하면 체력이 금방 소모될 수 있어, 최소한의 기준선과 루틴을 정해 두면 좋습니다.",
        characters: ["주유", "법정", "마초", "위연", "육손", "손책"],
        keywords: ["유연함", "센스", "적응력", "창의성", "즉흥력"],
      },
    };

    const questionsContainer = document.getElementById("questions-container");
    const progressText = document.getElementById("progress-text");
    const progressBarInner = document.getElementById("progress-bar-inner");
    const formError = document.getElementById("form-error");
    const form = document.getElementById("quiz-form");
    const resetBtn = document.getElementById("reset-btn");

    const resultCard = document.getElementById("result-card");
    const resultTypeLabel = document.getElementById("result-type-label");
    const resultMainTitle = document.getElementById("result-main-title");
    const resultSubtitle = document.getElementById("result-subtitle");
    const resultDescription = document.getElementById("result-description");
    const resultCharacters = document.getElementById("result-characters");
    const resultKeywords = document.getElementById("result-keywords");
    const resultLetterBadge = document.getElementById("result-letter-badge");
    const resultCounts = document.getElementById("result-counts");
    const copyBtn = document.getElementById("copy-btn");
    const shareBtn = document.getElementById("share-btn");

    // 질문 DOM 생성
    questions.forEach((q, index) => {
      const qIdx = index + 1;
      const wrapper = document.createElement("div");
      wrapper.className = "question";

      const header = document.createElement("div");
      header.className = "question-header";

      const indexEl = document.createElement("div");
      indexEl.className = "q-index";
      indexEl.textContent = String(qIdx).padStart(2, "0");

      const titleEl = document.createElement("div");
      titleEl.className = "q-title";
      titleEl.textContent = q.text;

      header.appendChild(indexEl);
      header.appendChild(titleEl);

      const optionsEl = document.createElement("div");
      optionsEl.className = "options";

      Object.entries(q.options).forEach(([key, label]) => {
        const optLabel = document.createElement("label");
        optLabel.className = "option";

        const input = document.createElement("input");
        input.type = "radio";
        input.name = `q${qIdx}`;
        input.value = key;

        const spanWrapper = document.createElement("span");
        spanWrapper.className = "option-label";

        const keySpan = document.createElement("span");
        keySpan.className = "opt-key";
        keySpan.textContent = key;

        const textSpan = document.createElement("span");
        textSpan.className = "opt-text";
        textSpan.textContent = label;

        spanWrapper.appendChild(keySpan);
        spanWrapper.appendChild(textSpan);

        optLabel.appendChild(input);
        optLabel.appendChild(spanWrapper);
        optionsEl.appendChild(optLabel);
      });

      wrapper.appendChild(header);
      wrapper.appendChild(optionsEl);
      questionsContainer.appendChild(wrapper);
    });

    function updateProgress() {
      let answered = 0;
      questions.forEach((_, idx) => {
        const qIdx = idx + 1;
        const checked = document.querySelector(`input[name="q${qIdx}"]:checked`);
        if (checked) answered++;
      });
      progressText.textContent = `${answered} / ${questions.length} 문항 응답됨`;
      const ratio = answered / questions.length;
      progressBarInner.style.width = (ratio * 100).toFixed(0) + "%";
    }

    questionsContainer.addEventListener("change", (e) => {
      if (e.target.matches('input[type="radio"]')) {
        updateProgress();
        formError.style.display = "none";
      }
    });

    function calculateResult() {
      const counts = { A: 0, B: 0, C: 0, D: 0, E: 0 };
      const unanswered = [];

      questions.forEach((_, idx) => {
        const qIdx = idx + 1;
        const checked = document.querySelector(`input[name="q${qIdx}"]:checked`);
        if (!checked) {
          unanswered.push(qIdx);
        } else {
          counts[checked.value]++;
        }
      });

      return { counts, unanswered };
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const { counts, unanswered } = calculateResult();

      if (unanswered.length > 0) {
        formError.style.display = "block";
        resultCard.style.display = "none";
        return;
      }

      let bestLetter = "A";
      let bestCount = counts["A"];
      ["B", "C", "D", "E"].forEach((letter) => {
        if (counts[letter] > bestCount) {
          bestCount = counts[letter];
          bestLetter = letter;
        }
      });

      const result = resultMap[bestLetter];
      const pick = result.characters[0];

      resultTypeLabel.textContent = `${result.letter} 유형 · ${result.name}`;
      resultMainTitle.textContent = `당신은 '${pick}' 타입에 가깝습니다`;
      resultSubtitle.textContent = result.subtitle;
      resultDescription.textContent = result.description;
      resultLetterBadge.textContent = `${result.letter} 유형`;

      resultCharacters.innerHTML = "";
      result.characters.forEach((c) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = c;
        resultCharacters.appendChild(chip);
      });

      resultKeywords.innerHTML = "";
      result.keywords.forEach((kw) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = kw;
        resultKeywords.appendChild(chip);
      });

      resultCounts.innerHTML = `
        <span>A: ${counts.A}</span>
        <span>B: ${counts.B}</span>
        <span>C: ${counts.C}</span>
        <span>D: ${counts.D}</span>
        <span>E: ${counts.E}</span>
      `;

      resultCard.style.display = "block";
      formError.style.display = "none";
      resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    resetBtn.addEventListener("click", () => {
      form.reset();
      updateProgress();
      formError.style.display = "none";
      resultCard.style.display = "none";
    });

    function buildResultText() {
      const { counts, unanswered } = calculateResult();
      if (unanswered.length > 0 || (!counts.A && !counts.B && !counts.C && !counts.D && !counts.E)) {
        return "아직 테스트를 완료하지 않았습니다. 모든 문항에 응답 후 다시 시도해 주세요.";
      }

      let bestLetter = "A";
      let bestCount = counts["A"];
      ["B", "C", "D", "E"].forEach((letter) => {
        if (counts[letter] > bestCount) {
          bestCount = counts[letter];
          bestLetter = letter;
        }
      });

      const result = resultMap[bestLetter];
      const pick = result.characters[0];

      const baseUrl = window.location.href;
      const textLines = [
        "🐲 삼국지 인물 성격 테스트 결과",
        "",
        `• 나의 유형: ${result.letter} 유형 — ${result.name}`,
        `• 대표 인물: ${pick} (외 ${result.characters.length - 1}인)`,
        `• 키워드: ${result.keywords.join(", ")}`,
        "",
        `한 줄 설명: ${result.subtitle}`,
        "",
        "(이 페이지에서 직접 다시 테스트할 수 있어요)",
        baseUrl.startsWith("file:") ? "" : baseUrl,
      ];

      return textLines.filter(Boolean).join("\n");
    }

    async function copyResultToClipboard() {
      const text = buildResultText();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        alert("결과가 클립보드에 복사되었습니다. 붙여넣기 해서 공유해 보세요!");
      } catch (err) {
        alert("복사 기능을 사용할 수 없습니다. 대신 결과 영역을 길게 눌러 직접 복사해 주세요.");
      }
    }

    copyBtn.addEventListener("click", () => {
      copyResultToClipboard();
    });

    shareBtn.addEventListener("click", async () => {
      const text = buildResultText();
      const url = window.location.href.startsWith("file:")
        ? undefined
        : window.location.href;

      if (navigator.share) {
        try {
          await navigator.share({
            title: "삼국지 인물 성격 테스트 결과",
            text,
            url,
          });
        } catch (err) {
          if (err && err.name !== "AbortError") {
            await copyResultToClipboard();
          }
        }
      } else {
        await copyResultToClipboard();
      }
    });

    updateProgress();
  </script>
