      .sticky{position:sticky;top:12px}

    .tiny{

</head>

// 답안: 각 문항 0~3
let idx = 0;
let answers = Array(QUESTIONS.length).fill(null);

/* ====== 링크 공유(2bit packing) ====== */
function encodeAnswers(arr){
  // 0~3 -> 2bit, 4개씩 1바이트(8bit)
  const n = arr.length;
  const bytes = [];
  for(let i=0;i<n;i+=4){
    let b = 0;
    for(let j=0;j<4;j++){
      const v = (arr[i+j] ?? 0) & 3;
      b |= (v << (j*2));
    }
    bytes.push(b);
  }
  let bin = "";
  bytes.forEach(x => bin += String.fromCharCode(x));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodeAnswers(str, n){
  try{
    const b64 = str.replace(/-/g,"+").replace(/_/g,"/");
    const bin = atob(b64);
    const bytes = [...bin].map(ch => ch.charCodeAt(0));
    const out = [];
    for(const b of bytes){
      for(let j=0;j<4;j++){
        out.push((b >> (j*2)) & 3);
      }
    }
    return out.slice(0,n);
  }catch(e){ return null; }
}

/* ===============================
   5) 점수 계산/매칭
   =============================== */
function computeUserVector(){
  const v = Object.fromEntries(AXES.map(a=>[a.key, BASE]));
  for(let i=0;i<QUESTIONS.length;i++){
    const a = answers[i];
    if(a===null) continue;
    const eff = QUESTIONS[i].opt[a].eff || {};
    for(const k in eff){
      v[k] = clamp(v[k] + eff[k]);
    }
  }
  return v;
}
function distWeighted(u, k){
  // 축 가중치(분포를 잘 갈라주는 축에 약간 더)
  const W = {R:1.15,C:1.15,P:1.10,S:1.10,M:1.05,L:1.10,T:1.10,E:1.15};
  let s = 0;
  for(const ax of AXES){
    const key = ax.key;
    const d = (u[key]-k[key]);
    s += (d*d) * (W[key] || 1);
  }
  return Math.sqrt(s);
}
function signatureBonus(king, ans){
  // 6문항 선호가 맞을수록 미세 보정(동점/근접일 때만 영향)
  // 완전 강제는 아니고 "분리도"만 올리는 용도
  let hit = 0;
  for(let i=0;i<SIG_Q.length;i++){
    const qi = SIG_Q[i];
    if(ans[qi] === king.sig[i]) hit++;
  }
  return hit; // 0~6
}
function rankKings(){
  const u = computeUserVector();
  const scored = KINGS.map(k=>{
    const d = distWeighted(u, k.v);
    const sig = signatureBonus(k, answers);
    // 최종 점수: 거리(작을수록 좋음) + 시그니처 보정
    // sig가 높으면 거리에서 약간 이득
    const adj = d - (sig * 1.8);
    return { ...k, d, sig, adj };
  }).sort((a,b)=> a.adj - b.adj);

  return {u, scored};
}

function axisLabel(axKey, value){
  // 0~100 -> 라벨
  const ax = AXES.find(x=>x.key===axKey);
  if(!ax) return "";
  if(value >= 70) return ax.right;
  if(value <= 30) return ax.left;
  return "중간";
}

function topAxes(u){
  // 중립(50)에서 멀리 벗어난 축 상위
  const arr = AXES.map(ax=>{
    const v = u[ax.key];
    return {key:ax.key, name:ax.name, v, delta: Math.abs(v-50), label: axisLabel(ax.key,v)};
  }).sort((a,b)=> b.delta - a.delta);
  return arr;
}

  for(const x of t){
    if(x.key==="R" && x.v>55) out.push("판을 바꾸는 개혁 추진력");
    if(x.key==="C" && x.v>55) out.push("의사결정 속도/컨트롤");
    if(x.key==="P" && x.v>55) out.push("현실적 리스크 관리");
    if(x.key==="S" && x.v>55) out.push("제도·기록 기반 설계");
    if(x.key==="M" && x.v>55) out.push("안보·대응 역량");
    if(x.key==="L" && x.v>55) out.push("기강·집행력");
    if(x.key==="T" && x.v>55) out.push("투명/기록으로 신뢰 확보");
    if(x.key==="E" && x.v>55) out.push("민심/체감 중심 운영");
    if(x.key==="R" && x.v<45) out.push("급변보다 안정 유지");
    if(x.key==="C" && x.v<45) out.push("협치/분권으로 갈등 완충");
  }
  // 중복 제거 + 최소 3개
  const uniq = [...new Set(out)];
  while(uniq.length < 3) uniq.push("상황에 맞춘 균형 운영");
  return uniq.slice(0,4);
}
function buildGenericRisks(u){
  const out = [];
  if(u.C>=75 && u.T<=40) out.push("불신(‘밀실’ 인식) 리스크");
  if(u.L>=75 && u.E<=40) out.push("반발/이탈(강압 피로) 리스크");
  if(u.R>=75 && u.P<=40) out.push("이상 과잉으로 실행력 저하 가능");
  if(u.P>=75 && u.E<=40) out.push("민심과 거리감(냉정함으로 비칠 수)");
  if(u.S>=75 && u.M<=40) out.push("현장/안보 대응이 느려질 수 있음");
  if(u.E>=75 && u.L<=35) out.push("원칙/집행력 약화로 흐트러질 수 있음");
  if(out.length===0) out.push("균형형: 강점이 분산되어 ‘한 방’이 약하게 보일 수 있음");
  return out.slice(0,4);
}
function buildOpsTips(u){
  const tips = [];
  if(u.T>=65) tips.push("기록(의사결정 로그) + 공개 범위를 미리 정의해 신뢰를 유지");
  else tips.push("핵심 결정은 근거를 남겨 ‘왜’가 보이게 하기(불신 예방)");
  if(u.C>=65) tips.push("강한 드라이브를 쓸 땐 ‘안전장치(견제/피드백)’를 함께");
  else tips.push("협치형이면 ‘결정 시한’과 ‘책임자’를 명확히(느려지는 것 방지)");
  if(u.E>=65) tips.push("민생 정책은 체감 지표(물가/치안/구휼)로 관리");
  if(u.R>=65) tips.push("개혁은 ‘파일럿→확대’로 실패 비용을 줄이기");
  if(u.M>=65) tips.push("안보 강화 시 재정/민생과의 균형 메시지 동시 제공");
  return tips.slice(0,5);
}

/* ===============================
   6) 화면 렌더
   =============================== */
function renderHome(){
  statusPill.textContent = "대기";
  screen.innerHTML = `
    <div class="card hero">
      <h1>20개의 상황에서 선택하면, 당신과 닮은 조선 왕이 나옵니다</h1>
      <p>
        8개 축(개혁·집권·실리·제도·안보·엄정·투명·민생) 점수를 계산해
        <b>조선 왕 27명 중 가장 가까운 결과</b>를 매칭하고, 해설까지 제공합니다.
      </p>

      <div class="sep"></div>
      <div class="row">
        <span class="badge">⏱ 약 2~3분</span>
        <span class="badge">🔗 결과 링크 공유</span>
        <span class="badge">📌 27명 전원 후보</span>
      </div>

      <div class="btns">
        <button class="primary" id="startBtn">게임 시작</button>
        <button class="ghost" id="loadBtn">링크로 결과 불러오기</button>
      </div>

      <p class="hint">
        팁: “무난한 답”만 고르면 세종/정조 같은 균형형으로 몰릴 수 있어요.
        직감대로 고를수록 분포가 다양해집니다.
      </p>
    </div>
  `;
  $("#startBtn").onclick = ()=>{
    idx = 0;
    answers = Array(QUESTIONS.length).fill(null);
    renderQuestion();
  };
  $("#loadBtn").onclick = ()=>{
    const h = location.hash.replace(/^#/,"").trim();
    if(!h){ showToast("불러올 결과 링크가 없어요."); return; }
    const arr = decodeAnswers(h, QUESTIONS.length);
    if(!arr || arr.length!==QUESTIONS.length){ showToast("링크가 깨졌어요."); return; }
    answers = arr;
    idx = QUESTIONS.length;
    renderResult();
  };
}

function renderQuestion(){
  const q = QUESTIONS[idx];
  statusPill.textContent = `진행 ${idx+1}/${QUESTIONS.length}`;
  const prog = Math.round((idx/QUESTIONS.length)*100);

  const optHtml = q.opt.map((o,i)=>`
    <button class="choice" data-i="${i}">
      <div class="k">
        <div class="key">${o.k}</div>
        <div>
          <div class="main">${o.text}</div>
          <div class="note">${o.note}</div>
        </div>
      </div>
    </button>
  `).join("");

  screen.innerHTML = `
    <div class="card">
      <div class="progress" aria-label="progress"><div class="bar" style="width:${prog}%"></div></div>
      <div style="height:12px"></div>

      <div class="qhead">
        <div>
          <div class="qno">Q${idx+1}</div>
          <p class="qtxt">${q.title}</p>
          <p class="qsub">${q.sub}</p>
        </div>
        <div class="pill">4지선다</div>
      </div>

      <div class="choices">${optHtml}</div>

      <div class="btns" style="margin-top:14px">
        <button class="ghost" id="backBtn" ${idx===0?"disabled":""}>이전</button>
        <button class="ghost" id="homeBtn">처음으로</button>
      </div>
      <p class="hint">한 문제를 고르면 다음으로 자동 진행됩니다.</p>
    </div>
  `;

  document.querySelectorAll(".choice").forEach(btn=>{
    btn.onclick = ()=>{
      const i = Number(btn.dataset.i);
      answers[idx] = i;
      idx++;
      if(idx >= QUESTIONS.length) renderResult();
      else renderQuestion();
    };
  });

  $("#backBtn").onclick = ()=>{
    if(idx>0){ idx--; renderQuestion(); }
  };
  $("#homeBtn").onclick = ()=> renderHome();
}

function renderResult(){
  statusPill.textContent = "결과";
  const {u, scored} = rankKings();
  const top = scored[0];
  const top5 = scored.slice(0,5);

  const axesSorted = topAxes(u);
  const why = axesSorted.slice(0,4).map(x => `- <b>${x.name}</b>: ${x.label} (${Math.round(x.v)})`).join("<br/>");

  const strengths = buildGenericStrengths(u).map(x=>`<li>${x}</li>`).join("");
  const risks = buildGenericRisks(u).map(x=>`<li>${x}</li>`).join("");
  const tips = buildOpsTips(u).map(x=>`<li>${x}</li>`).join("");

  const scoreHtml = AXES.map(ax=>{
    const v = u[ax.key];
    const pct = Math.round(v);
    return `
      <div class="scoreRow">
        <div class="lab"><span>${ax.name}</span><span>${axisLabel(ax.key,v)} · ${pct}</span></div>
        <div class="meter"><div style="width:${pct}%"></div></div>
      </div>
    `;
  }).join("");

  const rankHtml = top5.map((k,i)=>`
    <div class="item">
      <div><b>${i+1}. ${k.name}</b> <span class="muted">· ${k.tag}</span></div>
      <div class="pill">유사도 ${Math.max(0, 100 - Math.round(k.d)).toString()} · 보정 ${k.sig}/6</div>
    </div>
  `).join("");

  // 공유 링크 만들기
  const hash = encodeAnswers(answers.map(x => x ?? 0));
  const shareUrl = `${location.origin}${location.pathname}#${hash}`;
  if(location.hash.replace(/^#/,"") !== hash){
    history.replaceState(null, "", `#${hash}`);
  }

  screen.innerHTML = `
    <div class="twoCol">
      <div class="card resultTop">
        <div class="row">
          <span class="badge">🏆 최종 매칭 <b>${top.name}</b></span>
          <span class="badge">🧩 ${top.tag}</span>
        </div>

        <h2 class="kingName">${top.name}</h2>
        <p class="tagline">${top.bio}</p>

        <div class="sep"></div>

        <div class="card" style="background:var(--card2);box-shadow:none">
          <div style="font-weight:1000">왜 이 결과가 나왔나</div>
          <div class="hint" style="margin-top:8px">${why}</div>
        </div>

        <div class="card" style="background:var(--card2);box-shadow:none">
          <div style="font-weight:1000">강점</div>
          <ul class="list">${strengths}</ul>
        </div>

        <div class="card" style="background:var(--card2);box-shadow:none">
          <div style="font-weight:1000">주의 포인트</div>
          <ul class="list">${risks}</ul>
        </div>

        <div class="card" style="background:var(--card2);box-shadow:none">
          <div style="font-weight:1000">운영 팁</div>
          <ul class="list">${tips}</ul>
        </div>

        <div class="btns">
          <button class="primary" id="copyBtn">결과 링크 복사</button>
          <button id="retryBtn">다시하기</button>
          <button class="ghost" id="homeBtn2">처음으로</button>
        </div>

        <div class="linkBox" id="shareBox">${shareUrl}</div>

        <details style="margin-top:10px">
          <summary>디버그(축 점수 원문 보기)</summary>
          <div class="hint" style="margin-top:8px">
            ${AXES.map(ax=>`- ${ax.key}(${ax.name}): ${Math.round(u[ax.key])}`).join("<br/>")}
          </div>
        </details>
      </div>

      <div class="card sticky">
        <div style="font-weight:1000">당신의 성향 점수(8축)</div>
        <div style="height:10px"></div>
        <div class="scoreGrid">${scoreHtml}</div>

        <div class="sep"></div>

        <div style="font-weight:1000">상위 5명 후보</div>
        <div class="rank">${rankHtml}</div>

        <p class="hint" style="margin-top:10px">
          * “유사도”는 내부 거리 기반 지표(낮을수록 가까움)를 보기 좋게 변환한 값입니다.<br/>
          * 보정(0~6)은 일부 문항에서의 선호 패턴이 맞는 정도로, 결과가 한쪽으로 쏠리는 것을 줄이기 위한 장치입니다.
        </p>
      </div>
    </div>
  `;

  $("#copyBtn").onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(shareUrl);
      showToast("복사됨!");
    }catch(e){
      prompt("아래 링크를 길게 눌러 복사해줘.", shareUrl);
    }
  };
  $("#retryBtn").onclick = ()=>{
    idx = 0;
    answers = Array(QUESTIONS.length).fill(null);
    renderQuestion();
  };
  $("#homeBtn2").onclick = ()=> renderHome();
}

/* ===============================
   7) 시작 시 해시 복원
   =============================== */
(function init(){
  const h = location.hash.replace(/^#/,"").trim();
  if(h){
    const arr = decodeAnswers(h, QUESTIONS.length);
    if(arr && arr.length===QUESTIONS.length){
      answers = arr;
      idx = QUESTIONS.length;
      renderResult();
      return;
    }
  }
  renderHome();
})();
</script>
</body>
</html>
