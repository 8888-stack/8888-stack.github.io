function clampScore(n){ return Math.max(-CLAMP, Math.min(CLAMP, n)); }
function showToast(msg){

}

function encodeChoices(arr){
  // 0/1 배열 -> 비트 문자열 -> base64url
  const bits = arr.map(x=>x?1:0).join("");
  let hex = "";
  for(let i=0;i<bits.length;i+=4){
    const chunk = bits.slice(i,i+4).padEnd(4,"0");
    hex += parseInt(chunk,2).toString(16);
  }
  // hex -> bytes
  const bytes = [];
  for(let i=0;i<hex.length;i+=2) bytes.push(parseInt(hex.slice(i,i+2).padEnd(2,"0"),16));
  let bin = "";
  bytes.forEach(b=> bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodeChoices(str, n){
  try{
    const b64 = str.replace(/-/g,"+").replace(/_/g,"/");
    const bin = atob(b64);
    const bytes = [...bin].map(ch=> ch.charCodeAt(0));
    let hex = bytes.map(b=> b.toString(16).padStart(2,"0")).join("");
    let bits = "";
    for(const h of hex){
      bits += parseInt(h,16).toString(2).padStart(4,"0");
    }
    const arr = bits.slice(0,n).split("").map(c=> c==="1"?1:0);
    if(arr.length!==n) return null;
    return arr;
  }catch(e){ return null; }
}

function dist(a,b){
  let s=0;
  for(const ax of AXES){
    const k=ax.key;
    const d=(a[k]||0)-(b[k]||0);
    s += d*d;
  }
  return Math.sqrt(s);
}
function similarityScore(userV, kingV){
  const d = dist(userV, kingV);
  return 1/(1+d); // 0~1
}
function pct(n){ return Math.round(n*100); }

/* =========================
   2) 상태
   ========================= */
let step = 0;
let choices = Array(QUESTIONS.length).fill(null); // 0(A) / 1(B)

function computeUserVector(){
  const v = Object.fromEntries(AXES.map(a=>[a.key,0]));
  for(let i=0;i<QUESTIONS.length;i++){
    const c = choices[i];
    if(c===null) continue;
    const eff = (c===0 ? QUESTIONS[i].a.eff : QUESTIONS[i].b.eff);
    for(const k in eff) v[k] = clampScore((v[k]||0) + eff[k]);
  }
  return v;
}

function computeRanking(){
  const u = computeUserVector();
  const scored = KINGS.map(kg=>{
    const s = similarityScore(u, kg.v);
    return { ...kg, score:s };
  }).sort((x,y)=> y.score - x.score);

  // 상위 3 퍼센트(상대값으로 보기 좋게 정규화)
  const max = scored[0].score || 1;
  const top3 = scored.slice(0,3).map(x=> ({...x, rel: x.score/max}));
  return {u, scored, top3};
}

/* =========================
   3) 화면 렌더
   ========================= */
function renderHome(){
  statusPill.textContent = "대기 중";
  screen.innerHTML = `
    <div class="card hero">
      <h1>당신의 통치 스타일은 어떤 왕과 닮았을까?</h1>
      <p>
        12개의 상황에서 선택을 하면, 성향 점수(6축)를 계산해
        <b>조선 왕 27명 중 가장 가까운 인물</b>을 매칭해줘.
      </p>
      <div class="sp"></div>
      <div class="row">
        <span class="badge">⏱ 약 1분</span>
        <span class="badge">🔗 결과 링크 공유</span>
        <span class="badge">📌 해설 포함</span>
      </div>
      <div class="btns">
        <button class="primary" id="startBtn">게임 시작</button>
        <button class="ghost" id="loadBtn">링크로 결과 불러오기</button>
      </div>
      <p class="hint" style="margin-top:10px">
        * “링크로 결과 불러오기”는 URL에 저장된 선택값을 읽어 복원해.
      </p>
    </div>
  `;
  $("#startBtn").onclick = ()=>{
    step = 0;
    choices = Array(QUESTIONS.length).fill(null);
    renderQuestion();
  };
  $("#loadBtn").onclick = ()=>{
    const h = location.hash.replace(/^#/,"").trim();
    if(!h){ showToast("불러올 링크 정보가 없어요."); return; }
    const decoded = decodeChoices(h, QUESTIONS.length);
    if(!decoded){ showToast("링크 정보가 깨졌어요."); return; }
    choices = decoded;
    step = QUESTIONS.length;
    renderResult();
  };
}

function renderQuestion(){
  statusPill.textContent = `진행 ${step+1}/${QUESTIONS.length}`;
  const q = QUESTIONS[step];
  const prog = Math.round((step/QUESTIONS.length)*100);

  screen.innerHTML = `
    <div class="card">
      <div class="progress" aria-label="progress"><div class="bar" style="width:${prog}%"></div></div>
      <div style="height:12px"></div>
      <div class="qhead">
        <div>
          <div class="qno">Q${step+1}</div>
          <p class="qtxt">${q.title}</p>
          <p class="qsub">${q.sub}</p>
        </div>
        <div class="pill">선택 2개</div>
      </div>

      <div class="choices">
        <button class="choice" id="aBtn">
          A. ${q.a.text}
          <small>${q.a.note}</small>
        </button>
        <button class="choice" id="bBtn">
          B. ${q.b.text}
          <small>${q.b.note}</small>
        </button>
      </div>

      <div class="btns" style="margin-top:14px">
        <button class="ghost" id="backBtn" ${step===0?"disabled":""}>이전</button>
        <button class="ghost" id="homeBtn">처음으로</button>
      </div>
      <p class="hint">팁: 직감대로 고르는 게 결과가 다양해져.</p>
    </div>
  `;

  $("#aBtn").onclick = ()=> { choices[step]=0; step++; step>=QUESTIONS.length ? renderResult() : renderQuestion(); };
  $("#bBtn").onclick = ()=> { choices[step]=1; step++; step>=QUESTIONS.length ? renderResult() : renderQuestion(); };
  $("#backBtn").onclick = ()=> { if(step>0){ step--; renderQuestion(); } };
  $("#homeBtn").onclick = ()=> { renderHome(); };
}

function renderResult(){
  statusPill.textContent = "결과";
  const {u, top3} = computeRanking();
  const best = top3[0];

  // 점수 표시용 0~100
  const axisToPct = (val)=> Math.round(((val + CLAMP) / (2*CLAMP)) * 100);

  const scoreHtml = AXES.map(ax=>{
    const v = u[ax.key]||0;
    const p = axisToPct(v);
    const left = ax.left, right = ax.right;
    return `
      <div class="scoreRow">
        <div class="lab"><span>${ax.name}</span><span>${v>0?right:(v<0?left:"중간")}</span></div>
        <div class="meter"><div style="width:${p}%"></div></div>
      </div>
    `;
  }).join("");

  const top3Html = top3.map((k,i)=>`
    <div class="item">
      <div>
        <span class="b">${i+1}. ${k.name}</span>
        <span class="muted" style="font-size:12px"> · ${k.tag}</span>
      </div>
      <div class="badge">${pct(k.rel)}%</div>
    </div>
  `).join("");

  screen.innerHTML = `
    <div class="card resultTop">
      <div class="row">
        <span class="badge">🏆 최종 매칭</span>
        <span class="badge">🔎 상위 3명 제공</span>
      </div>
      <h2 class="kingName">${best.name}</h2>
      <p class="tagline"><b>${best.tag}</b> — ${best.bio}</p>

      <div class="sp"></div>

      <div class="grid" style="gap:12px">
        <div class="card" style="padding:14px">
          <div class="row" style="justify-content:space-between">
            <div class="b">당신의 성향 점수</div>
            <div class="pill">6축 분석</div>
          </div>
          <div class="scores" style="margin-top:10px">${scoreHtml}</div>
        </div>

        <div class="card" style="padding:14px">
          <div class="row" style="justify-content:space-between">
            <div class="b">상위 3명</div>
            <div class="pill">가까운 후보</div>
          </div>
          <div class="top3" style="margin-top:10px">${top3Html}</div>
          <p class="hint" style="margin-top:8px">
            %는 “1위와의 상대적 유사도”야. 2~3위가 비슷하면 성향이 복합형이라는 뜻.
          </p>
        </div>

        <div class="card" style="padding:14px">
          <div class="b">해설(읽는 법)</div>
          <p class="hint" style="margin:8px 0 0">
            - <span class="b">개혁/변화</span>: 규칙을 바꾸며 판을 새로 짜는가?<br/>
            - <span class="b">집권/권위</span>: 중앙으로 모아 빠르게 추진하는가?<br/>
            - <span class="b">실리/현실</span>: 손해를 줄이고 결과를 챙기는가?<br/>
            - <span class="b">학문/문화</span>: 기록·교육·제도를 중시하는가?<br/>
            - <span class="b">강경/결단</span>: 단호한 조치로 질서를 세우는가?<br/>
            - <span class="b">민생/공감</span>: 백성 체감과 현장 문제를 먼저 보는가?
          </p>
        </div>
      </div>

      <div class="btns" style="margin-top:14px">
        <button class="primary" id="copyBtn">결과 링크 복사</button>
        <button id="retryBtn">다시하기</button>
        <button class="ghost" id="homeBtn2">처음으로</button>
      </div>
      <p class="hint">블로그에는 아래 “결과 링크”를 걸면 바로 테스트가 열려.</p>
      <div class="card" style="padding:12px;margin-top:10px">
        <div class="muted" style="font-size:12px">공유 링크</div>
        <div class="b" id="shareUrl" style="word-break:break-all;margin-top:6px"></div>
      </div>
    </div>
  `;

  const hash = encodeChoices(choices.map(x=>x?1:0));
  const url = `${location.origin}${location.pathname}#${hash}`;
  $("#shareUrl").textContent = url;

  $("#copyBtn").onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(url);
      showToast("복사됨!");
    }catch(e){
      // 클립보드 막힌 환경 대비
      prompt("아래 링크를 길게 눌러 복사해줘.", url);
    }
  };
  $("#retryBtn").onclick = ()=>{
    step = 0;
    choices = Array(QUESTIONS.length).fill(null);
    renderQuestion();
  };
  $("#homeBtn2").onclick = ()=> renderHome();

  // 주소창 해시에도 반영(새로고침해도 결과 복원)
  if(location.hash.replace(/^#/,"") !== hash){
    history.replaceState(null, "", `#${hash}`);
  }
}

/* =========================
   4) 시작 시 링크 복원
   ========================= */
(function init(){
  const h = location.hash.replace(/^#/,"").trim();
  const decoded = h ? decodeChoices(h, QUESTIONS.length) : null;
  if(decoded){
    choices = decoded;
    step = QUESTIONS.length;
    renderResult();
  }else{
    renderHome();
  }
})();
</script>

</html>
